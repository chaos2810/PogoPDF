<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PogoPDF</title>
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    .card {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f5f5f0;
      border: 1px solid rgba(15, 23, 42, 0.14);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background-image: url("logo.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.72; transform: scale(0.96); }
    }
    .name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #0f172a;
    }
    .bar {
      width: 200px;
      height: 4px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: #0369a1;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .status {
      font-size: 12px;
      color: #6e6e73;
      min-height: 16px;
    }
    @media (prefers-color-scheme: dark) {
      .card { background: #1c1c1a; border-color: rgba(236, 234, 228, 0.16); }
      .name { color: #eceae4; }
      .bar { background: rgba(236, 234, 228, 0.14); }
      .bar i { background: #38bdf8; }
      .status { color: #a8a29e; }
    }
  </style>
</head>
<body>
  <div class="card" data-testid="splash-card">
    <div class="logo" role="img" aria-label="PogoPDF"></div>
    <div class="name">PogoPDF</div>
    <div class="bar"><i></i></div>
    <div class="status" data-testid="splash-status">Preparing the engine</div>
  </div>
</body>
</html>
